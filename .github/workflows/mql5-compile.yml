name: MQL5 Compile

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -NoNewWindow

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $roots = @("C:\Program Files","C:\Program Files (x86)","$env:LOCALAPPDATA")
          $meta = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $meta = Get-ChildItem -Path $root -Filter "metaeditor64.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($meta) { break }
            }
          }
          if (-not $meta) { throw "metaeditor64.exe not found." }
          "METAEDITOR=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor=$($meta.FullName)"

      - name: Compile SmartTradingBot
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "MQL5\Experts\SmartTradingBot.mq5"
          $include = Join-Path $env:GITHUB_WORKSPACE "MQL5"
          $log = Join-Path $env:GITHUB_WORKSPACE "SmartTradingBot.compile.log"

          & $env:METAEDITOR "/compile:$source" "/inc:$include" "/log:$log"

          if (Test-Path $log) {
            Write-Host "=== COMPILE LOG ==="
            Get-Content $log | Write-Host
          } else {
            throw "Compilation log not produced."
          }

          $content = Get-Content $log -Raw
          if ($content -match "(?i)\b[1-9][0-9]*\s+error") {
            throw "Compilation reported errors."
          }

          $ex5 = Join-Path $env:GITHUB_WORKSPACE "MQL5\Experts\SmartTradingBot.ex5"
          if (-not (Test-Path $ex5)) {
            throw "SmartTradingBot.ex5 was not produced."
          }

          Write-Host "COMPILE SUCCESS"

      - name: Upload compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarttradingbot-compile-output
          path: |
            SmartTradingBot.compile.log
            MQL5/Experts/SmartTradingBot.ex5
          if-no-files-found: warn
