name: MetaEditor compile (Windows)
on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-mql5:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare compile artifacts
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:RUNNER_TEMP 'mql5-compile-artifacts'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          "ARTIFACT_DIR=$artifactDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MetaTrader 5 / MetaEditor
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'mt5setup.exe'
          $installDir = 'C:\mt5'
          Invoke-WebRequest -Uri 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe' -OutFile $installer
          if (-not (Test-Path $installer)) { throw 'MetaTrader 5 installer download failed.' }
          New-Item -ItemType Directory -Force -Path $installDir | Out-Null
          $installerProcess = Start-Process -FilePath $installer -ArgumentList @('/auto', "/path:$installDir") -Wait -PassThru
          Start-Sleep -Seconds 5
          $editor = Get-ChildItem -Path $installDir -Filter 'metaeditor64.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $editor) {
            $editor = Get-ChildItem -Path 'C:\Program Files' -Filter 'metaeditor64.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $editor) { throw "MetaEditor was not found after installation (installer exit code $($installerProcess.ExitCode))." }
          "METAEDITOR_PATH=$($editor.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "MetaEditor version: $($editor.VersionInfo.FileVersion)"

      - name: Compile SmartTradingBot_FINAL.mq5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'MQL5\Experts\SmartTradingBot_FINAL.mq5'
          $mql5Root = Join-Path $env:GITHUB_WORKSPACE 'MQL5'
          $ex5 = [IO.Path]::ChangeExtension($source, '.ex5')
          $log = [IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5, $log -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $env:METAEDITOR_PATH)) { throw 'METAEDITOR_PATH is invalid.' }
          $metaEditorVersion = (Get-Item $env:METAEDITOR_PATH).VersionInfo.FileVersion
          $compileArg = '/compile:"' + $source + '"'
          $includeArg = '/include:"' + $mql5Root + '"'
          $compileArgs = @('/portable', $compileArg, $includeArg, '/log')
          $compileProcess = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList $compileArgs -Wait -PassThru
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw "MetaEditor did not create the expected compiler log: $log (process exit $($compileProcess.ExitCode))." }
          $logText = Get-Content -Path $log -Raw
          Write-Host $logText
          Copy-Item -Path $log -Destination (Join-Path $env:ARTIFACT_DIR 'SmartTradingBot_FINAL.compile.log') -Force
          if ($logText -notmatch '(?i)\b0 errors?,\s*0 warnings?\b') {
            throw 'Compiler log does not confirm zero errors and zero warnings.'
          }
          if (-not (Test-Path $ex5)) { throw 'Compiler reported success but a fresh EX5 was not created.' }
          $sourceHash = (Get-FileHash -Path $source -Algorithm SHA256).Hash
          $ex5Hash = (Get-FileHash -Path $ex5 -Algorithm SHA256).Hash
          $manifest = [ordered]@{
            source = 'MQL5/Experts/SmartTradingBot_FINAL.mq5'
            sourceSha256 = $sourceHash
            compiledArtifact = 'SmartTradingBot_FINAL.ex5'
            compiledArtifactSha256 = $ex5Hash
            metaEditorVersion = $metaEditorVersion
            sourceCommit = '${{ github.sha }}'
            compiledUtc = [DateTime]::UtcNow.ToString('o')
            liveAutoTradingDefault = $true
            riskSizingDefault = $true
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -FilePath (Join-Path $env:ARTIFACT_DIR 'provenance.json') -Encoding utf8
          Copy-Item -Path $ex5 -Destination (Join-Path $env:ARTIFACT_DIR 'SmartTradingBot_FINAL.ex5') -Force
          "Fresh MetaEditor compile passed: 0 errors, 0 warnings." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "Source SHA-256: $sourceHash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          "EX5 SHA-256: $ex5Hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Compile LRN04 SHA256 golden-vector script
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'MQL5\Scripts\LRN04_SHA256_GoldenVector.mq5'
          $mql5Root = Join-Path $env:GITHUB_WORKSPACE 'MQL5'
          $ex5 = [IO.Path]::ChangeExtension($source, '.ex5')
          $log = [IO.Path]::ChangeExtension($source, '.log')
          Remove-Item $ex5, $log -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $source)) { throw "SHA-256 test script not found: $source" }
          $compileArg = '/compile:"' + $source + '"'
          $includeArg = '/include:"' + $mql5Root + '"'
          $compileProcess = Start-Process -FilePath $env:METAEDITOR_PATH -ArgumentList @('/portable', $compileArg, $includeArg, '/log') -Wait -PassThru
          Start-Sleep -Seconds 2
          if (-not (Test-Path $log)) { throw "MetaEditor did not create test-script compiler log: $log (process exit $($compileProcess.ExitCode))." }
          $logText = Get-Content -Path $log -Raw
          Write-Host $logText
          Copy-Item -Path $log -Destination (Join-Path $env:ARTIFACT_DIR 'LRN04_SHA256_GoldenVector.compile.log') -Force
          if ($logText -notmatch '(?i)\b0 errors?,\s*0 warnings?\b') {
            throw 'SHA-256 test script compile did not confirm zero errors and zero warnings.'
          }
          if (-not (Test-Path $ex5)) { throw 'Compiler reported success but SHA-256 test EX5 was not created.' }
          Copy-Item -Path $ex5 -Destination (Join-Path $env:ARTIFACT_DIR 'LRN04_SHA256_GoldenVector.ex5') -Force
          "LRN04 SHA-256 test script compile passed: 0 errors, 0 warnings." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload compiler log, EX5, and provenance manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaeditor-build-${{ github.sha }}
          path: ${{ runner.temp }}\mql5-compile-artifacts\
          if-no-files-found: warn
          retention-days: 14
