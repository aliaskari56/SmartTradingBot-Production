name: LRN-04 journal contract tests

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run reference contract tests
        run: python -m unittest -v tools/test_lrn04_journal_contract.py
