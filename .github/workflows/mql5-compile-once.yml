name: MQL5 Compile Once

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "mt5setup.exe"
          Invoke-WebRequest -Uri "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe" -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait -NoNewWindow

      - name: Locate MetaEditor
        shell: pwsh
        run: |
          $meta = Get-ChildItem -Path "C:\Program Files\MetaTrader 5" -Filter "MetaEditor64.exe" -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $meta) { throw "MetaEditor64.exe not found." }
          "METAEDITOR=$($meta.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "MetaEditor=$($meta.FullName)"

      - name: Compile SmartTradingBot and capture compiler output
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "MQL5\Experts\SmartTradingBot.mq5"
          $include = Join-Path $env:GITHUB_WORKSPACE "MQL5"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "compile-evidence"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          if (-not (Test-Path $source)) { throw "Source not found: $source" }

          $args = @("/compile:$source","/inc:$include","/log")
          $p = Start-Process -FilePath $env:METAEDITOR -ArgumentList $args -Wait -PassThru -NoNewWindow

          Write-Host "MetaEditor process exit code: $($p.ExitCode)"
          Start-Sleep -Seconds 3

          $roots = @(
            $env:GITHUB_WORKSPACE,
            "$env:APPDATA\MetaQuotes",
            "$env:LOCALAPPDATA\MetaQuotes"
          ) | Where-Object { Test-Path $_ }

          $logs = @(
            foreach ($root in $roots) {
              Get-ChildItem -Path $root -Filter "*.log" -Recurse -File -ErrorAction SilentlyContinue |
                Where-Object { $_.LastWriteTime -ge (Get-Date).AddMinutes(-5) }
            }
          ) | Sort-Object LastWriteTime -Descending -Unique

          if ($logs.Count -eq 0) {
            Write-Host "No compiler .log found in expected paths."
          } else {
            foreach ($f in $logs) {
              $safe = ($f.FullName -replace '[:\\/]','_').Trim('_')
              $dest = Join-Path $outDir "$safe.txt"
              Copy-Item $f.FullName $dest -Force
              Write-Host "=== LOG: $($f.FullName) ==="
              Get-Content $f.FullName -Tail 200 | Write-Host
            }
          }

          $allEx5 = @(
            foreach ($root in @($env:GITHUB_WORKSPACE,"$env:APPDATA\MetaQuotes","$env:LOCALAPPDATA\MetaQuotes")) {
              if (Test-Path $root) {
                Get-ChildItem -Path $root -Filter "SmartTradingBot.ex5" -Recurse -File -ErrorAction SilentlyContinue
              }
            }
          ) | Sort-Object LastWriteTime -Descending -Unique

          if ($allEx5.Count -gt 0) {
            foreach ($f in $allEx5) {
              $dest = Join-Path $outDir ("EX5_" + [IO.Path]::GetFileName($f.FullName))
              Copy-Item $f.FullName $dest -Force
              Write-Host "EX5: $($f.FullName) size=$($f.Length) modified=$($f.LastWriteTime)"
            }
          } else {
            Write-Host "No SmartTradingBot.ex5 located after compile."
          }

          @(
            "MetaEditor=$env:METAEDITOR"
            "ProcessExitCode=$($p.ExitCode)"
            "Source=$source"
            "Time=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content (Join-Path $outDir "compile-meta.txt")

          Get-ChildItem $outDir -File | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host

      - name: Upload fresh compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smarttradingbot-fresh-compile-3
          path: compile-evidence/**
          if-no-files-found: warn
